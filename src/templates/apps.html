{% extends 'base.html' %}
{% block main %}
<section class="page-head"><div class="wrap">
  <h1>All Apps</h1>
  <p class="lead">Explore our collection of Android apps. Find the right app for your needs and check its privacy policy for more details.</p>
</div></section>
<section class="section"><div class="wrap" id="catalog" data-per-page="{{ site.apps_per_page }}">
  <div class="filters">
    <div class="search"><input id="search" type="search" placeholder="Search apps..." aria-label="Search apps"></div>
    <div class="chips" role="group" aria-label="Filter by category">
      <button class="chip is-on" type="button" data-cat="">All</button>
      {% for c in cats %}<button class="chip" type="button" data-cat="{{ c.slug }}">{{ c.name }}</button>{% endfor %}
    </div>
  </div>
  <div class="grid grid-3" id="grid">{% for a in apps %}{{ m.card(a) }}{% endfor %}</div>
  <p class="empty muted" id="empty" hidden>No apps match your search.</p>
  <nav class="pager" id="pager" aria-label="Pages"></nav>
</div></section>
{% endblock %}
